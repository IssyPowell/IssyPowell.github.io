<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f9f4;
            color: #2c3e2c;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            color: #2e7d32;
            margin: 0;
        }

        h2 {
            font-size: 1.5rem;
            color: #558b2f;
            margin: 10px 0 0 0;
            font-weight: 400;
        }

        .skills-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .skill-item {
            text-align: center;
            width: 100px;
        }

        .icon {
            width: 60px;
            height: 60px;
            background-color: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .skill-name {
            font-size: 0.9rem;
            color: #333;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            width: 90%;
            margin-bottom: 50px;
        }

        .project-card {
            background-color: white;
            border: 2px solid #81c784;
            border-radius: 10px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #2e7d32;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
            background-color: #e8f5e9;
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .skills-container {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Your Name</h1>
        <h2>Engineering Portfolio</h2>
    </header>

    <div class="skills-container">
        <div class="skill-item">
            <div class="icon">1</div>
            <div class="skill-name">Skill 1</div>
        </div>
        <div class="skill-item">
            <div class="icon">2</div>
            <div class="skill-name">Skill 2</div>
        </div>
        <div class="skill-item">
            <div class="icon">3</div>
            <div class="skill-name">Skill 3</div>
        </div>
        <div class="skill-item">
            <div class="icon">4</div>
            <div class="skill-name">Skill 4</div>
        </div>
    </div>

    <div class="projects-grid">
        <a href="#" class="project-card">Project 1</a>
        <a href="#" class="project-card">Project 2</a>
        <a href="#" class="project-card">Project 3</a>
        <a href="#" class="project-card">Project 4</a>
        <a href="#" class="project-card">Project 5</a>
        <a href="#" class="project-card">Project 6</a>
    </div>

</body>
</html>
